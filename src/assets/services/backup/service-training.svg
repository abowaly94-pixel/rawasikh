<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t1">
  <title id="t1">تدريب: سبورة شرح يتصاعد عليها المنحنى، ومنصة أمامها</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFAF4"/>
      <stop offset=".58" stop-color="#F8F2E6"/>
      <stop offset="1" stop-color="#EEE2CB"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E4"/>
      <stop offset="1" stop-color="#E0CFAF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCD91"/>
      <stop offset="1" stop-color="#B8862C"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#33568F"/>
      <stop offset=".55" stop-color="#183365"/>
      <stop offset="1" stop-color="#0D1E40"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5EDDD"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2B5BC4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2B5BC4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lat" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#0B1B33" stroke-width="1" opacity=".05">
        <path d="M28 4 52 28 28 52 4 28Z"/>
        <path d="M0 28h56M28 0v56"/>
      </g>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B1B33" flood-opacity=".16"/>
    </filter>
    <filter id="shs" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B1B33" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#lat)"/>
  <ellipse cx="600" cy="170" rx="450" ry="250" fill="url(#glow)"/>

  <!-- stage: the arch the brand is built on -->
  <path d="M410 404V300a190 190 0 0 1 380 0v104Z" fill="url(#sand)" opacity=".9" filter="url(#sh)"/>
  <path d="M410 404V300a190 190 0 0 1 380 0v104" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".55"/>

  <path d="M96 404h1008" stroke="#B8862C" stroke-width="2" opacity=".28"/>
  <ellipse cx="600" cy="410" rx="230" ry="14" fill="#0B1B33" opacity=".08"/>

  <!-- focal: the teaching board -->
  <g filter="url(#sh)">
    <rect x="466" y="176" width="268" height="176" rx="12" fill="url(#board)"/>
    <rect x="466" y="176" width="268" height="176" rx="12" fill="none" stroke="url(#gold)" stroke-width="3.5" opacity=".85"/>
    <!-- rising line: the outcome of training -->
    <path d="M498 320l54-38 46 18 62-84" fill="none" stroke="url(#navy)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="552" cy="282" r="8" fill="#183365"/>
    <circle cx="598" cy="300" r="8" fill="#183365"/>
    <path d="M644 234l24-18-6 30" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M498 340h204" stroke="#D6C4A4" stroke-width="3"/>
    <g stroke="#D6C4A4" stroke-width="3" stroke-linecap="round">
      <path d="M498 216h96"/><path d="M498 240h62"/>
    </g>
  </g>

  <!-- lectern in front of the board -->
  <g filter="url(#shs)">
    <path d="M520 404l14-58h132l14 58Z" fill="url(#navy)"/>
    <rect x="530" y="336" width="140" height="12" rx="6" fill="url(#gold)"/>
    <rect x="576" y="300" width="48" height="38" rx="5" fill="#FFFDF7" stroke="#DCCBAE" stroke-width="3"/>
  </g>

  <!-- the audience the session reaches -->
  <g filter="url(#shs)">
    <path d="M866 372h44v24a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10Z" fill="url(#navy)" opacity=".9"/>
    <path d="M866 342h44v22a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10Z" fill="url(#navy)"/>
    <path d="M926 360h44v34a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10Z" fill="url(#navy)" opacity=".72"/>
    <path d="M926 328h44v24a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10Z" fill="url(#navy)" opacity=".92"/>
  </g>

  <!-- arc of growth leaving the board -->
  <path d="M742 214c40-30 84-44 128-44" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="6 9" opacity=".7"/>
  <path d="M862 166l22 4-8 20" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

  <g fill="#C79A3F">
    <path d="M330 210l6 17 17 6-17 6-6 17-6-17-17-6 17-6Z" opacity=".42"/>
    <path d="M1058 292l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z" opacity=".34"/>
  </g>
</svg>
