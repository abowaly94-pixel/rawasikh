<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t1">
  <title id="t1">تدريب: سبورة شرح يتصاعد عليها المنحنى، ومنبر بميكروفون، وصفوف من الأذكياء</title>
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFAF4"/>
      <stop offset=".58" stop-color="#F8F2E6"/>
      <stop offset="1" stop-color="#EEE2CB"/>
    </linearGradient>
    <linearGradient id="t-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E4"/>
      <stop offset="1" stop-color="#E0CFAF"/>
    </linearGradient>
    <linearGradient id="t-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCD91"/>
      <stop offset="1" stop-color="#B8862C"/>
    </linearGradient>
    <linearGradient id="t-navy" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#33568F"/>
      <stop offset=".55" stop-color="#183365"/>
      <stop offset="1" stop-color="#0D1E40"/>
    </linearGradient>
    <linearGradient id="t-board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5EDDD"/>
    </linearGradient>
    <radialGradient id="t-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2B5BC4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2B5BC4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="t-lat" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#0B1B33" stroke-width="1" opacity=".05">
        <path d="M28 4 52 28 28 52 4 28Z"/>
        <path d="M0 28h56M28 0v56"/>
      </g>
    </pattern>
    <filter id="t-sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B1B33" flood-opacity=".16"/>
    </filter>
    <filter id="t-shs" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B1B33" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#t-bg)"/>
  <rect width="1200" height="480" fill="url(#t-lat)"/>
  <ellipse cx="600" cy="170" rx="450" ry="250" fill="url(#t-glow)"/>

  <!-- stage: the arch the brand is built on, plus a quieter one for depth -->
  <path d="M410 404V300a190 190 0 0 1 380 0v104Z" fill="url(#t-sand)" opacity=".9" filter="url(#t-sh)"/>
  <path d="M410 404V300a190 190 0 0 1 380 0v104" fill="none" stroke="url(#t-gold)" stroke-width="2.5" opacity=".55"/>
  <path d="M900 404v-56a84 84 0 0 1 168 0v56Z" fill="url(#t-sand)" opacity=".5"/>

  <path d="M96 404h1008" stroke="#B8862C" stroke-width="2" opacity=".28"/>
  <ellipse cx="600" cy="410" rx="235" ry="14" fill="#0B1B33" opacity=".08"/>

  <!-- brand chevrons, quiet watermark -->
  <g fill="none" stroke="#0B1B33" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 182l58 56-58 56" stroke-width="13" opacity=".055"/>
    <path d="M166 182l58 56-58 56" stroke-width="13" opacity=".04"/>
  </g>

  <!-- easel legs behind the board -->
  <g stroke="url(#t-navy)" stroke-linecap="round">
    <path d="M470 320L450 404" stroke-width="11"/>
    <path d="M666 320L686 404" stroke-width="11"/>
    <path d="M458 372h220" stroke-width="8"/>
  </g>

  <!-- focal: the teaching board -->
  <g filter="url(#t-sh)">
    <rect x="424" y="138" width="288" height="184" rx="14" fill="url(#t-navy)"/>
    <rect x="436" y="150" width="264" height="160" rx="10" fill="url(#t-board)"/>
    <rect x="436" y="150" width="264" height="160" rx="10" fill="none" stroke="url(#t-gold)" stroke-width="3" opacity=".8"/>
    <!-- plan of the session -->
    <g stroke="#D6C4A4" stroke-width="3" stroke-linecap="round">
      <path d="M460 176h96"/><path d="M460 198h60"/>
    </g>
    <!-- rising line: the outcome of training -->
    <path d="M460 276l56-40 46 18 58-84" fill="none" stroke="url(#t-navy)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="516" cy="236" r="7" fill="#183365"/>
    <circle cx="562" cy="254" r="7" fill="#183365"/>
    <path d="M620 170l24-18-4 30" fill="none" stroke="url(#t-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- dotted arc of growth leaving the board -->
  <path d="M704 148c54-32 102-44 156-42" fill="none" stroke="url(#t-gold)" stroke-width="2.5" stroke-dasharray="6 9" opacity=".7"/>
  <path d="M856 100l24 2-12 20" fill="none" stroke="url(#t-gold)" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

  <!-- lectern with microphone in front -->
  <g filter="url(#t-shs)">
    <path d="M740 404l14-62h132l14 62Z" fill="url(#t-navy)"/>
    <rect x="746" y="332" width="148" height="12" rx="6" fill="url(#t-gold)"/>
    <rect x="790" y="296" width="52" height="38" rx="4" fill="#FFFDF7" stroke="#DCCBAE" stroke-width="3"/>
    <path d="M884 332V268" stroke="url(#t-gold)" stroke-width="5" stroke-linecap="round"/>
    <rect x="866" y="214" width="36" height="52" rx="17" fill="url(#t-navy)"/>
    <g stroke="#F6E7C4" stroke-width="2.5" stroke-linecap="round" opacity=".45">
      <path d="M874 230h22"/><path d="M874 242h22"/><path d="M874 254h22"/>
    </g>
    <rect x="872" y="266" width="24" height="9" rx="3" fill="url(#t-gold)"/>
  </g>

  <!-- the audience the session reaches -->
  <g filter="url(#t-shs)">
    <g fill="url(#t-navy)" opacity=".7">
      <circle cx="930" cy="296" r="9" fill="#22417A"/>
      <circle cx="978" cy="296" r="9" fill="#22417A"/>
      <circle cx="1026" cy="296" r="9" fill="#22417A"/>
      <rect x="907" y="308" width="46" height="22" rx="10"/>
      <rect x="955" y="308" width="46" height="22" rx="10"/>
      <rect x="1003" y="308" width="46" height="22" rx="10"/>
    </g>
    <g fill="url(#t-navy)">
      <circle cx="902" cy="336" r="10"/>
      <circle cx="954" cy="336" r="10"/>
      <circle cx="1006" cy="336" r="10"/>
      <circle cx="1058" cy="336" r="10"/>
      <rect x="877" y="349" width="50" height="26" rx="11"/>
      <rect x="929" y="349" width="50" height="26" rx="11"/>
      <rect x="981" y="349" width="50" height="26" rx="11"/>
      <rect x="1033" y="349" width="50" height="26" rx="11"/>
    </g>
  </g>

  <g fill="#C79A3F">
    <path d="M330 204l6 17 17 6-17 6-6 17-6-17-17-6 17-6Z" opacity=".42"/>
    <path d="M1084 182l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z" opacity=".34"/>
  </g>
</svg>
